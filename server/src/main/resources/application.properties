server.port=${HYDRO_SERVER_PORT:8080}

spring.application.name=hydro-license-server
spring.datasource.url=jdbc:h2:file:./data/hydrodb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

hydro.server.keys-file=${HYDRO_KEYS_FILE:./data/server-keys.json}
hydro.server.heartbeat-interval-sec=${HYDRO_HB_INTERVAL:15}
hydro.server.session-lease-sec=${HYDRO_LEASE_SEC:45}
hydro.server.max-clock-skew-sec=${HYDRO_CLOCK_SKEW:120}
